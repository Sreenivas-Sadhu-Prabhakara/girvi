<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0E0D12;
    --card: #17151F;
    --line: #2E2A3F;
    --text: #EFEDF6;
    --muted: #ABA5C3;
    --violet: #9B82FF;
    --violet-deep: #7C5CFF;
    --ink: #0E0D12;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(1000px 560px at 88% -14%, rgba(124, 92, 255, 0.22), transparent 62%),
      linear-gradient(180deg, #0B0A10 0%, #0E0D12 100%);
    font-family: var(--sans);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .frame {
    position: absolute; inset: 0;
    padding: 78px 88px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 20px; }
  .mark { width: 74px; height: 74px; }
  .wordmark { font-size: 62px; font-weight: 800; letter-spacing: -0.035em; }

  .mid { display: flex; align-items: center; gap: 70px; }
  .headline { max-width: 560px; }
  .headline h1 {
    font-size: 52px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.12;
  }
  .headline .v { color: var(--violet); }
  .headline p {
    margin-top: 22px;
    font-size: 27px; font-weight: 500; color: var(--muted); line-height: 1.4;
    max-width: 30ch;
  }

  /* the staircase — hallmark-punched 85/80/75 steps */
  .stairs { width: 420px; height: 300px; }
  .stairs text {
    font-family: var(--sans); font-weight: 800; fill: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .stairs .pct { font-size: 44px; }
  .stairs .band { font-size: 18px; font-weight: 600; opacity: 0.85; }

  .chips { display: flex; gap: 14px; }
  .chip {
    padding: 12px 22px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: rgba(23, 21, 31, 0.7);
    font-size: 22px; font-weight: 650; color: var(--muted);
  }
  .chip strong { color: var(--violet); font-weight: 800; }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#17151F"/>
        <path d="M5 25 h7.4 v-6.5 h7.3 v-6.5 h7.3" fill="none" stroke="#9B82FF" stroke-width="3" stroke-linecap="square"/>
      </svg>
      <span class="wordmark">girvi</span>
    </div>

    <div class="mid">
      <div class="headline">
        <h1>Know your gold loan ceiling <span class="v">before the branch quotes you.</span></h1>
        <p>RBI&rsquo;s tiered LTV caps, clause-cited — 2025 Directions, in force since April 2026.</p>
      </div>
      <svg class="stairs" viewBox="0 0 420 300" aria-hidden="true">
        <g fill="#9B82FF">
          <rect x="0"   y="40"  width="132" height="240"/>
          <rect x="140" y="90"  width="132" height="190"/>
          <rect x="280" y="140" width="132" height="140"/>
        </g>
        <g fill="#0E0D12" opacity="0.85">
          <rect x="12"  y="52"  width="10" height="10"/><rect x="30"  y="52"  width="10" height="10"/><rect x="48" y="52" width="10" height="10"/>
          <rect x="152" y="102" width="10" height="10"/><rect x="170" y="102" width="10" height="10"/><rect x="188" y="102" width="10" height="10"/>
          <rect x="292" y="152" width="10" height="10"/><rect x="310" y="152" width="10" height="10"/><rect x="328" y="152" width="10" height="10"/>
        </g>
        <text class="pct" x="66"  y="180" text-anchor="middle">85%</text>
        <text class="pct" x="206" y="210" text-anchor="middle">80%</text>
        <text class="pct" x="346" y="240" text-anchor="middle">75%</text>
        <text class="band" x="66"  y="252" text-anchor="middle">≤ ₹2.5 L</text>
        <text class="band" x="206" y="252" text-anchor="middle">₹2.5–5 L</text>
        <text class="band" x="346" y="266" text-anchor="middle">&gt; ₹5 L</text>
      </svg>
    </div>

    <div class="chips">
      <span class="chip"><strong>clause-cited</strong>&nbsp;RBI rules</span>
      <span class="chip">bullet vs EMI true cost</span>
      <span class="chip">margin-call headroom</span>
      <span class="chip"><strong>no network</strong> — ever</span>
    </div>
  </div>
</body>
</html>
